    <script>
        (function() {
            try {
                var theme = localStorage.getItem('18studio_theme') || 'dark';
                document.documentElement.classList.add(theme);
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) {}
        })();
    </script>

                    <!-- Supabase JS Library -->
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030e10;
            color: white;
            margin: 0;
            overflow: hidden;
        }

        html.light,
        html.light body,
        html.light #root {
            background-color: #f8fafc !important;
            color: #0f172a !important;
            color-scheme: light !important;
        }

        html.light aside {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
            color: #0f172a !important;
        }

        html.light main {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }

        html.light .glass-panel,
        html.light .rp-card {
            background-color: #ffffff !important;
            background-image: none !important;
            border: 1px solid #cbd5e1 !important;
            color: #0f172a !important;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.08) !important;
        }

        html.dark,
        html.dark body,
        html.dark #root {
            background: radial-gradient(ellipse 100% 80% at 60% 10%, #072226 0%, #041315 55%, #020b0d 100%) !important;
            background-color: #030e10 !important;
            color: #ffffff !important;
            color-scheme: dark !important;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(45, 212, 191, 0.18);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(45, 212, 191, 0.35);
        }

        .glass-panel,
        .rp-card {
            background: linear-gradient(155deg, rgba(11, 38, 41, 0.85) 0%, rgba(5, 21, 23, 0.92) 100%);
            border: 1px solid rgba(45, 212, 191, 0.16);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.55), inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
        }

        .menu-item.active {
            background: linear-gradient(90deg, rgba(13, 148, 136, 0.35) 0%, rgba(20, 184, 166, 0.12) 100%);
            border: 1px solid rgba(45, 212, 191, 0.3);
            color: #fff;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .calendar-day {
            min-height: 85px;
            height: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 7px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
            cursor: pointer;
        }

        .calendar-day:hover:not(.empty-day) {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .calendar-day.empty-day {
            background: transparent;
            border-color: transparent;
            cursor: default;
        }

        .calendar-day.today {
            border-color: rgba(96, 165, 250, 0.5);
            background: rgba(96, 165, 250, 0.05);
        }

        .calendar-day.selected {
            border-color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .slot-indicator {
            height: 4px;
            border-radius: 2px;
            width: 100%;
        }

        .status-available {
            background-color: #4ade80;
        }

        .status-filling {
            background-color: #fbbf24;
        }

        .status-full {
            background-color: #ef4444;
        }

        .status-closed {
            background-color: #6b7280;
        }
    </style>
